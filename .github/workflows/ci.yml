name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest pyarrow
          pip install -e . --no-deps

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Smoke test core modules (no data required)
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          import numpy as np
          from fastcharge.chargetime import charge_time_h, multistage_time_h, time_savings_law
          from fastcharge.optimize import pareto_front, hypervolume_2d
          from fastcharge.protocol import protocol_features
          from fastcharge.damage import damage_density_params, damage_stages
          from fastcharge.rl import ChargeEnv, solve_dp

          CT = {'a_cc': 0.87, 'c_cv': 0.43, 'd_tail': 0.17}
          v = charge_time_h(0.6, np.array([0.5,1,2,3]), 0.87, 0.43, 0.17)
          assert np.all(np.diff(v) < 0), 'time must decrease with rate'

          # cascade must be faster than its slowest uniform rate
          tier = multistage_time_h([(2.0,0.0,0.3),(1.0,0.3,0.6)], CT)
          slow = multistage_time_h([(1.0,0.0,0.6)], CT)
          assert tier < slow

          # CV paid once regardless of stage count
          one = multistage_time_h([(1.0,0.0,0.5)], CT)
          two = multistage_time_h([(1.0,0.0,0.25),(1.0,0.25,0.5)], CT)
          assert abs(one - two) < 1e-9

          F = np.array([[1.,3.],[2.,2.],[3.,1.]])
          assert len(pareto_front(F)) == 3

          DMG = damage_density_params(0.0007, 0.12, 2.0)
          low = damage_stages([(1.0,0.0,0.2)], DMG)
          high = damage_stages([(1.0,0.8,1.0)], DMG)
          assert high > low, 'high SOC must be more damaging'

          env = ChargeEnv(0.0, 0.8, DMG, CT, lam=0.002, n_states=8)
          dp = solve_dp(env)
          assert len(dp['policy_rates']) == env.n
          print('smoke OK:', v.round(3), 'cascade', round(tier,3))
          "

      - name: Run quickstart example
        run: python examples/quickstart.py
